"waterfall":1},{"startTime":2800279.030282,"url":"https:\u002F\u002Fitem-api-prod.liveauctioneers.com\u002Fspa\u002Fads\u002Fpage?c=20170802&keywords=tiffany+lamp&pageName=search","endTime":2800306.886499,"error":null,"method":"GET","status":200,"totalTime":27.856216999702156,"waterfall":2},{"startTime":2800279.645864,"url":"https:\u002F\u002Fsearch-party-prod.liveauctioneers.com\u002Fsearch\u002Frelatedsearches?c=20170802&query=tiffany+lamp&size=50&deviceId=eba36002-73c5-4254-a93e-0bb92dd8a254","endTime":2800325.823872,"error":null,"method":"GET","status":200,"totalTime":46.17800799990073,"waterfall":2}],"totalFetchTime":354.42},"url":"\u002Fsearch\u002F?keyword=tiffany%20lamp"}},"article":{"article":null,"error":null,"loaded":false,"loading":false,"requestKey":null},"articleLinks":{"links":[{"id":"15","title":"Tiffany lamps: American classics","slug":"tiffany-studios-lamps-history-auction","topic":"Home & Décor","author":"Matt Ball","subtitle":"Behind every glowing Tiffany Studios lamp is a story of glass innovation — and often an unheralded woman designer.","description":"A guide to Tiffany Studios lamps, from Louis Comfort Tiffany's Favrile glass to designer Clara Driscoll's Dragonfly pattern.","heroImageUrl":"https:\u002F\u002Fp1.liveauctioneers.com\u002F1044\u002F417832\u002F232445095_1_x.jpg?height=2000&quality=95&version=1778951107","secondaryImageUrl":"https:\u002F\u002Fp1.liveauctioneers.com\u002F6487\u002F405437\u002F226649478_1_x.jpg?height=2000&quality=95&version=1772462855","content":"![Tiffany Studios Daffodil Table Lamp](https:\u002F\u002Fp1.liveauctioneers.com\u002F1044\u002F417832\u002F232445095_1_x.jpg?height=2000&quality=95&version=1778951107 \"A Tiffany Studios \\\"Daffodil\\\" table lamp realized $30,000 plus buyer’s premium in June 2026. Image courtesy of Fontaine’s Auction Gallery and LiveAuctioneers.\")\n\nNEW YORK, NY — Tiffany lamps are magical artifacts in the collecting world. Illuminate one, and all the creative passion that went into its conception electrifies the viewer today.\n\nLouis Comfort Tiffany (1848-1933), son of Charles Lewis Tiffany, founder of Tiffany & Co., started out as a painter. He studied at the National Academy of Design in New York City and with academic painter Léon-Charles-Adrien Bailly in Paris. A turning point came in the 1870s when L.C. Tiffany became fascinated with the properties of glass and worked in several glasshouses in Brooklyn. The first Tiffany Glass Company was incorporated on December 1, 1885. Seven years later it became the Tiffany Glass & Decorating Company and then Tiffany Studios in 1902.\n\nCentral to the appeal of any Tiffany lamp is the glass itself. Tiffany developed and trademarked Favrile glass in the 1890s — a type of iridescent art glass whose color is fused into the material rather than applied to its surface. The word derives from the Old English *fabrile*, meaning \"hand-wrought\" or \"hand-crafted\". Tiffany changed the word to be spelled with a 'v' as he believed it sounded better.\n\nFavrile glass is handmade, with different kinds of glass mixed together before the final product is coated in metallic oxides to achieve an iridescent, or color-changing sheen. Favrile glass shifts in hue depending on the angle and quality of light, which is why a Tiffany shade looks different at noon than it does by candlelight in the evening.\n\nWhile Tiffany designed some lamps himself, he employed many talented artists including Clara Driscoll (1861-1944), who was head of his Women’s Glass Cutting Department. Driscoll worked at Tiffany on and off for more than 20 years. Because engaged or married women were not allowed to work at the company, Driscoll had to leave due to her marriage in 1889 but after her husband died in 1892, she returned.\n\nFor much of the twentieth century, Louis Comfort Tiffany received sole credit for the lamp designs that bore his name. A book published in 2002 entitled *Tiffany Desk Treasures*, by George A. Kemeny and Donald Miller, began to rewrite history when it named Driscoll as the designer of Tiffany’s signature Dragonfly lampshade.\n\nThen in 2007, Martin Eidelberg (professor emeritus of art history at Rutgers University), Nina Gray and Margaret K. Hofer published a new book called *A New Light on Tiffany: Clara Driscoll and the Tiffany Girls* which identified Driscoll and her colleagues as the creative force behind many of the other most celebrated patterns. Letters she wrote to her family in Ohio, discovered at the Queens Historical Society in New York, described her work in vivid detail. The revelation reframed the Tiffany Studios story as a collaborative enterprise and brought long-overdue recognition to the women of the glass-cutting department.\n\n[![Tiffany Studios Drop Head Dragonfly Lamp](https:\u002F\u002Fp1.liveauctioneers.com\u002F6487\u002F405437\u002F226649478_1_x.jpg?height=2000&quality=95&version=1772462855 \"A Tiffany Studios Drop Head Dragonfly lamp with signed shade and base brought $69,000 plus buyer’s premium in March 2026. Image courtesy of Auctions at Deer Ridge Farm and LiveAuctioneers.\")](https:\u002F\u002Fwww.liveauctioneers.com\u002Fitem\u002F226649478_tiffany-studios-drop-head-dragonfly-lamp-signed-shade-and-base)\n\nThe lamps fell out of favor well before Tiffany's death in 1933, and for two decades afterward they were largely dismissed as Victorian curiosities. That changed in the mid-1950s, when a series of exhibitions and a landmark 1958 Parke-Bernet auction brought Tiffany Studios lamps back to the attention of serious dealers and collectors. The Dragonfly design remains among the most sought-after of all Tiffany patterns. Its jewel-like cabochon eyes and interlocking wing segments demand exceptional skill from the glass cutter, and signed examples with matching bases consistently attract competitive bidding. [**A Drop Head Dragonfly lamp with signed shade and base**](https:\u002F\u002Fwww.liveauctioneers.com\u002Fitem\u002F226649478_tiffany-studios-drop-head-dragonfly-lamp-signed-shade-and-base) achieved $69,000 plus buyer’s premium at Auctions at Deer Ridge Farm in March 2026.\n\n[![Tiffany Studios Signed Pineapple Lamp Base with Shade](https:\u002F\u002Fp1.liveauctioneers.com\u002F323\u002F412634\u002F229478209_1_x.jpg?height=2000&quality=95&version=1775272071 \"A Tiffany Studios signed Pineapple lamp base with shade scored $36,000 plus buyer’s premium in April 2026. Image courtesy of Kaminski Auctions and LiveAuctioneers.\")](https:\u002F\u002Fwww.liveauctioneers.com\u002Fitem\u002F229478209_tiffany-studios-signed-pineapple-lamp-base-with-shade)\n\nThe range of Tiffany Studios lamp designs is broader than many collectors realize. Beyond the celebrated floral shades, the studio produced geometric patterns, nature-inspired bases, and unusual forms such as the Pineapple, whose textured bronze standard is as much a work of art as the shade it supports. [**A signed Pineapple lamp base with shade**](https:\u002F\u002Fwww.liveauctioneers.com\u002Fitem\u002F229478209_tiffany-studios-signed-pineapple-lamp-base-with-shade) made $36,000 plus buyer’s premium at Kaminski Auctions in April 2026.\n\n[![Tiffany Studios Geometric Chandelier](https:\u002F\u002Fp1.liveauctioneers.com\u002F1044\u002F417832\u002F232752663_1_x.jpg?height=2000&quality=95&version=1779370329 \"A Tiffany Studios \\\"Geometric\\\" chandelier realized $21,000 plus buyer’s premium in June 2026. Image courtesy of Fontaine’s Auction Gallery and LiveAuctioneers.\")](https:\u002F\u002Fwww.liveauctioneers.com\u002Fitem\u002F232752663_tiffany-studios-geometric-chandelier)\n\nTiffany Studios also produced hanging shades for ceiling fixtures, and these ceiling-mount pieces offer collectors an entry point into the market at a range of price levels. The Geometric patterns — composed of regular leaded segments in creamy opalescent glass — represent the more restrained side of the Tiffany aesthetic, closer in spirit to the Arts and Crafts movement than to Art Nouveau. [**A Tiffany Studios \"Geometric\" chandelier**](https:\u002F\u002Fwww.liveauctioneers.com\u002Fitem\u002F232752663_tiffany-studios-geometric-chandelier) brought $21,000 plus buyer’s premium at Fontaine’s Auction Gallery in June 2026.\n\n[![Three Tier Bronze Lamp Table with Ten Tiffany Studios Favrile Glass Shades](https:\u002F\u002Fp1.liveauctioneers.com\u002F1098\u002F419496\u002F233400273_1_x.jpg?height=2000&quality=95&version=1780090821 \"A three-tier bronze lamp table with ten Tiffany Studios Favrile glass shades achieved $16,000 plus buyer’s premium at Michaan’s Auctions in June 2026. Image courtesy of Michaan’s Auctions and LiveAuctioneers.\")](https:\u002F\u002Fwww.liveauctioneers.com\u002Fitem\u002F233400273_three-tier-bronze-lamp-table-with-ten-tiffany-studios-favrile-glass-shades)\n\nAmong the most theatrical of all Tiffany lamp forms is the multi-light floor lamp, in which a branching bronze armature supports several individual Favrile glass shades. These pieces blur the boundary between furniture and sculpture. [**A three-tier bronze lamp table with ten Tiffany Studios Favrile glass shades**](https:\u002F\u002Fwww.liveauctioneers.com\u002Fitem\u002F233400273_three-tier-bronze-lamp-table-with-ten-tiffany-studios-favrile-glass-shades) realized $16,000 plus buyer’s premium at Michaan’s Auctions in June 2026 - a fitting result for a house that has long championed the form.\n\nAuthentication is a serious concern in the Tiffany market. The studio’s success spawned imitators during its own lifetime, and the twentieth century produced a steady supply of reproductions ranging from the obvious to the deceptive. Genuine Tiffany Studios pieces are typically signed on the shade rim and on the base, though signatures alone are not sufficient proof of authenticity. Look for a metal stamp on the shade or base reading 'TIFFANY STUDIOS NEW YORK' or early marks like 'TGCO' or 'TIFFANY GLASS AND DECORATING CO' for pieces before 1900. The stamp should be die-stamped into the metal, slightly uneven, reflecting hand-tooled production. Avoid perfectly uniform or stickered text, which indicates a reproduction.\n\nBuyers are advised to consult specialists, examine the glass under ultraviolet light, and review provenance documentation carefully before bidding on high-value examples. Examine the solder lines: they should be hand-applied, slightly raised, and aged, not perfectly smooth or shiny. Authentic Tiffany lamps are also heavier than reproductions due to high-quality glass and metal.\n\n---\n\nMatt Ball is Publishing Director of Antiques Trade Gazette. He has more than 30 years of experience working for media and technology businesses.","wordCount":984,"tags":[{"type":"category","value":"Chandeliers"},{"type":"category","value":"Floor Lamps"},{"type":"category","value":"Home & Décor"},{"type":"category","value":"Lamps"},{"type":"category","value":"Lighting"},{"type":"category","value":"Table Lamps"},{"type":"keyword","value":"Tiffany lamp"},{"type":"keyword","value":"Tiffany Studios lamp"}],"createdAt":"2026-08-11T00:00:00Z","updatedAt":"2026-09-10T14:08:52Z"}],"navigationId":1},"articleRelatedItems":{"itemIds":[]},"auctionCalendar":{"catalogIds":[],"catalogsTodayCount":0,"error":false,"facets":[],"submitted":false,"success":false,"totalFound":0},"auctionsNearMe":{"catalogIds":[],"catalogsNearMe":[],"currentPage":0,"error":null,"invalidLocationPath":null,"latestRequestId":null,"loading":false,"mapPoints":[],"nearbyFallback":null,"otherPlaces":[],"totalPages":0,"totalRecords":0,"totalUniqueHouses":0},"autoPopModal":{"dateLastShown":"","disableModalForTesting":false,"hasLoggedInBefore":false},"bankAccount":{"bankAccounts":[],"bankAccountsLoaded":0,"bankAccountsLoading":false,"errorMessage":"","plaidError":false,"plaidFetching":false,"plaidLinkTokens":{},"plaidSuccess":false},"bidCountDown":{"byId":{}},"bidderBiddingInfoAll":{"allBidItemIds":[],"leadingBidItemIds":[],"loaded":0,"loading":false,"pastBidItemIds":[],"upcomingBidItemIds":[],"
